<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Aucune connexion réseau permise depuis la page : les données ne peuvent pas sortir de l'iPad. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; manifest-src 'self'; worker-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Suivi des résidents</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="src/style.css">
  <script type="module" src="src/app.js"></script>
</head>
<body>
  <h1>Suivi des résidents</h1>
  <p id="storage-status" class="status">Vérification du stockage…</p>

  <form id="setup" hidden>
    <h2>Créer la phrase de passe</h2>
    <p>Elle chiffre toutes les données. Si vous l'oubliez, les données seront perdues : personne ne pourra les récupérer.</p>
    <label>Phrase de passe (12 caractères ou plus)
      <input type="password" name="passphrase" autocomplete="off" required>
    </label>
    <label>Confirmer
      <input type="password" name="confirmation" autocomplete="off" required>
    </label>
    <p class="error" role="alert"></p>
    <button type="submit">Créer</button>
  </form>

  <form id="unlock" hidden>
    <h2>App verrouillée</h2>
    <label>Phrase de passe
      <input type="password" name="passphrase" autocomplete="off" required>
    </label>
    <p class="error" role="alert"></p>
    <button type="submit">Déverrouiller</button>
    <button type="button" id="faceid-unlock" hidden>Déverrouillage biométrique</button>
  </form>

  <section id="main" hidden>
    <div id="dashboard"></div>
    <form id="faceid-setup" hidden>
      <h2>Déverrouillage biométrique</h2>
      <label>Confirmez avec la phrase de passe
        <input type="password" name="passphrase" autocomplete="off" required>
      </label>
      <p class="error" role="alert"></p>
      <button type="submit">Activer le déverrouillage biométrique</button>
    </form>
  </section>
</body>
</html>
